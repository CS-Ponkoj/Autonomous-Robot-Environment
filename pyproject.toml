# Project metadata. The simulator runs from this folder (run_sim.py); setup.ps1 installs the
# pinned requirements against requirements.lock. No license is declared yet: the owner chooses it.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-robot-environment"
version = "0.1.0"
description = "A MuJoCo office floor with a differential-drive robot, a safety layer, wandering cats, and a Gymnasium interface"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mujoco==3.14.0",
    "gymnasium==1.3.0",
    "numpy==2.4.6",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "pygame==2.6.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
dev = [
    "imageio==2.38.0",
    "imageio-ffmpeg==0.6.0",
    "pillow==12.3.0",
    "pygltflib==1.16.5",
    "scipy==1.17.1",
    "trimesh==4.8.3",
    "fast-simplification==0.2.0",
]

[tool.setuptools]
packages = ["robot_env"]
